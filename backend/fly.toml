# fly.toml app configuration file generated for rotaract-civ-api on 2026-09-30T13:45:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rotaract-civ-api'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  LOG_LEVEL = 'info'
  PORT = '8088'

[http_service]
  internal_port = 8088
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
