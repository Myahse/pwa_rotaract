<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="width:100%;max-width:430px;margin:0 auto;background:#ffffff;border:1px solid #ececee;border-radius:16px;overflow:hidden;font-family:Manrope,'Segoe UI',Arial,sans-serif;">
  <tr>
    <td style="padding:24px 28px;">
      <p style="margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:650;color:#be034d;">Rotaract CIV</p>
      <p style="margin:0 0 16px;font-size:13px;color:#73737a;">Carte de membre</p>
      <p style="margin:0 0 6px;font-size:20px;line-height:1.25;font-weight:650;color:#141416;">{{.FullName}}</p>
      <p style="margin:0 0 12px;font-size:15px;color:#444;">{{.ClubName}}</p>
      {{if .MemberSince}}
      <p style="margin:0 0 12px;font-size:14px;color:#73737a;">Membre depuis {{.MemberSince}}</p>
      {{end}}
      <p style="margin:0 0 6px;font-size:14px;color:#444;">Numéro de carte : <strong style="color:#141416;">{{.CardNumber}}</strong></p>
      <p style="margin:0;font-size:13px;color:#73737a;">Émise le {{formatDate .IssuedAt}}</p>
    </td>
  </tr>
</table>
